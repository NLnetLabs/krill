# ======================================================
# Continuous Integration: making sure the codebase works
# ======================================================
#
# --- Rust versions
#
# A regular `target/` consists of final artifacts (e.g. test binaries) and
# intermediates (compiled dependencies and incremental caches. We want to cache
# intermediates but not final artifacts (because they will be rebuilt anyways),
# so we configure Cargo to place intermediates in the `build/` folder instead.
#
# The data cached in `build/` is specific to the Rust compiler version that
# generated it, so we need to be careful to use the same compiler version when
# we re-use cached `build/`s.
#
# Where possible, we use the compiler version that comes pre-installed on the
# CI runners. We assume this is fairly close to the latest Rust stable, and
# that it does not change often.
#
# NOTE: We would use `actions-rust-lang/setup-rust-toolchain` to help set up
# Rust, but it does not support using the pre-installed CI version. We would
# like to use it in these cases because it also configures GitHub to provide
# annotations for Rust tool output; we copy their code and do that configuration
# manually (see `rust-annotations.json`).
# See <https://github.com/actions-rust-lang/setup-rust-toolchain/issues/66>.
#
# --- Caches
#
# `$os-$arch-system-$run_id` caches the `build/` generated by `cargo test`
# with all features enabled, using the Rust version pre-installed on the CI
# runner. `os` is `Linux`, `arch` is `X64`.
#
# `$os-$arch-nightly-clippy-$run_id` caches the `build/` generated by `cargo
# clippy` with all features enabled, using a nightly Rust version. The Rust
# version (in `rustup toolchain` format) is saved to `build/rust-version`.
# `os` is `Linux`, `arch` is `X64`.
#
# NOTE: We assume the Rust version installed on the CI runner does not change
# often. In theory, we could write down the Rust version in the cache and
# explicitly install that version when restoring from the cache; but this
# probably adds unnecessary overhead.

name: CI

# When the workflow runs
# ----------------------
on:
  # Creation or update of a pull request.
  pull_request:
    paths:
      - '**.rs'
      - 'test-resources/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'

  # A pull request is merged or someone directly pushes to `main`.
  push:
    branches: ['main']
    paths:
      - '**.rs'
      - 'test-resources/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/ci.yml'

  # Once a week (on `main`).
  # Accounts for changes to dependencies and Rust.
  # Updates caches.
  schedule:
    - cron: '0 10 * * FRI'

  # Manual invocation from the web UI.
  # Updates caches.
  workflow_dispatch: 

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_WARNINGS: "deny"
  CARGO_BUILD_BUILD_DIR: "build"

# Jobs
# ----------------------------------------------------------------------------
jobs:

  check:
    name: Check
    strategy:
      matrix:
        features:
          - "--no-default-features"
          - "--all-features"
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 1 # We use a cached `build/`.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Restore a dependency cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        # `system` refers to the pre-installed Rust version.
        key: ${{ runner.os }}-${{ runner.arch }}-system-

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Check
      run: cargo check ${{ matrix.features }}

    - name: Doc
      run: cargo doc --no-deps ${{ matrix.features }}

  check-minimal-versions:
    name: Check minimal versions
    runs-on: ubuntu-latest
    # env:
      # CARGO_INCREMENTAL: 1 # No caching at the moment.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Determine MSRV
      id: determine-msrv
      run: |
        msrv=`cargo metadata --no-deps --format-version 1 | jq -r '.packages[]|select(.name=="krill")|.rust_version'`
        echo "msrv=$msrv" >> "$GITHUB_OUTPUT"

    # TODO: Caching?

    - name: Set up Rust (at MSRV)
      id: setup-rust
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        # Last specified version becomes the default.
        toolchain: nightly, ${{ steps.determine-msrv.outputs.msrv }}
        cache: false
        matcher: false

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Lock dependencies to minimal versions
      run: cargo +nightly update -Z minimal-versions

    - name: Check
      run: cargo check --locked --all-targets --all-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 1 # We use a cached `build/`.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Restore from cache
      if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-nightly-clippy-

    - name: Set up Rust nightly
      run: |
        # Determine the version to install. Fall back to `nightly`.
        [[ -f build/rust-version ]] && version=$(cat build/rust-version)
        version=${version:-nightly}
        rustup toolchain install --component clippy $version 
        rustup default $version

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Check Clippy
      run: cargo clippy --locked --all-targets --all-features

    - name: Note Rust version for the cache
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      run: |
        # NOTE: `rustc --version --verbose` also prints a `commit-date`, which
        # is easier to parse, but it is unclear whether it perfectly matches
        # the date used for the nightly version by rustup. The date presented
        # in the first line seems more likely to be the right field.
        #
        # Sample input:
        # > $ rustc --version
        # > rustc 1.98.0-nightly (df6ee909e 2026-06-28)
        rustc --version \
          | grep --extended-regexp --only-matching '[0-9]{4}-[0-9]{2}-[0-9]{2}' \
          | sed 's/.*/nightly-&/' \
          | tee build/rust-version

    - name: Save to the cache
      uses: actions/cache/save@v6
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-nightly-clippy-${{ github.run_id }}

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 1 # We use a cached `build/`.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Restore from cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-system-

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Test
      run: cargo test --locked --all-targets --all-features -- --test-threads=1

    - name: Save to the cache
      uses: actions/cache/save@v6
      if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-system-${{ github.run_id }}

  openssl-test:
    name: Test with OpenSSL
    runs-on: ubuntu-latest
    # env:
      # CARGO_INCREMENTAL: 1 # No local incremental builds.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Restore from cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-system-

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Test
      run: cargo test --locked --all-targets --no-default-features --features hsm -- --test-threads=1

  pykmip-test:
    name: Test with PyKMIP
    runs-on: ubuntu-latest
    # env:
      # CARGO_INCREMENTAL: 1 # No local incremental builds.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        # Pin to Python 3.11 because 3.12 removes the ssl.wrap_socket()
        # function which PyKMIP uses.
        python-version: '3.11'

    - name: Install PyKMIP
      run: |
        pip install pykmip --constraint test-resources/pykmip/constraints.txt

    - name: Restore from cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-system-

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Run PyKMIP
      id: pykmip
      background: true
      working-directory: test-resources/pykmip
      run: python run-server.py

    - name: Wait for PyKMIP
      working-directory: test-resources/pykmip
      run: |
        sleep 5s
        openssl s_client -connect 127.0.0.1:5696 || true

    - name: Test
      run: cargo test --locked --all-targets --features hsm-tests-kmip -- --test-threads=1

    - name: Dump the PyKMIP log
      if: always()
      working-directory: test-resources/pykmip
      run: |
        ls -la
        cat server.log

    - name: Stop PyKMIP
      cancel: pykmip

  softhsm2-test:
    name: Test with SoftHSMv2
    runs-on: ubuntu-latest
    # env:
      # CARGO_INCREMENTAL: 1 # No local incremental builds.
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install SoftHSMv2
      run: |
        sudo apt-get update
        sudo apt-get install -y softhsm2
        sudo usermod -aG softhsm $(whoami)

    - name: Restore from cache
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cargo
          build/
        key: ${{ runner.os }}-${{ runner.arch }}-system-

    - name: Enable annotations
      run: echo "::add-matcher::.github/workflows/rust-annotations.json"

    - name: Set up SoftHSMv2
      run: |
        sg softhsm -c "softhsm2-util --init-token --slot 0 --label \"My token 1\" --pin 1234 --so-pin 1234"

    - name: Test
      run: sg softhsm -c "cargo test --locked --all-targets --features hsm-tests-pkcs11 -- --test-threads=1"

    - name: Dump the SoftHSMv2 log
      if: always()
      run: |
        cat /var/log/syslog
